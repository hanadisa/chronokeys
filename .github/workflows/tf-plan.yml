name: Terraform Plan & Validate 

on:
  pull_request: # Trigger on Pull Requests
    branches:
      - 'prod' # Only for PRs targeting the prod branch
    paths:
      - 'terraform/**' # Only run if changes are in the terraform directory

permissions:
  id-token: write # Required for Azure Login using OIDC
  contents: read # Required to checkout the repository code
  pull-requests: write # Required to post comments on the Pull Request

env:
  RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ secrets.STORAGE_ACCOUNT_NAME }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
  TFSTATE_KEY: ${{ secrets.TFSTATE_KEY }}

jobs:
  plan_and_validate:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # Action to checkout your repository code

    - name: Azure Login
      uses: azure/login@v1 
      with:
        creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","tenantId":"${{ secrets.ARM_TENANT_ID }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}"}'
        auth-type: 'SERVICE_PRINCIPAL'
        enable-AzPSSession: true

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2 # Action to set up Terraform CLI
      with:
        terraform_version: 1.7.0 

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=${{ env.CONTAINER_NAME }}" \
          -backend-config="key=${{ env.TFSTATE_KEY }}"

    - name: Terraform Plan
      id: plan 
      run: |
        # Run plan, capture output, and save to a file
        # -no-color removes ANSI escape codes, -input=false prevents prompts
        # || true ensures the step doesn't fail the job immediately if plan finds differences
        terraform plan -input=false -out=tfplan -no-color > plan_output.txt || true
        # Use `cat` to print the output to the workflow log for immediate viewing
        echo "::group::Terraform Plan Output"
        cat plan_output.txt
        echo "::endgroup::"

    - name: Install TFLint
      run: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        sudo mv tflint /usr/local/bin/

    - name: Run TFLint
      run: |
        echo "::group::TFLint Results"
        tflint --init # Initialize TFLint configuration
        tflint --format compact # Run TFLint and show results
        echo "::endgroup::"
      continue-on-error: true 

    - name: Run Checkov
      uses: bridgecrewio/checkov-action@v12 # Action for Checkov security scanning
      with:
        directory: terraform/ # Scan Terraform directory
        framework: terraform
        output_format: cli
        quiet: true # Suppress unnecessary log output
      continue-on-error: true 

    - name: Post Terraform Plan to PR
      uses: actions/github-script@v7 
      if: github.event_name == 'pull_request' # Only post comment if it's a PR event
      with:
        script: |
          const fs = require('fs');
          const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `#### 🚀 Terraform Plan Preview for this PR\n\`\`\`hcl\n${planOutput}\n\`\`\`\n\n_Review the plan carefully before merging._`
          });
        github-token: ${{ secrets.GITHUB_TOKEN }} 
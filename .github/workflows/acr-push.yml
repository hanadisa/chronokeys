name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - 'prod'
    paths:
      - 'app/**'
      - 'Dockerfile'

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: 'chronokeysacr'
  DOCKER_IMAGE_NAME: 'chronokeys-app'

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","tenantId":"${{ secrets.ARM_TENANT_ID }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}"}'
        auth-type: 'SERVICE_PRINCIPAL'
        enable-AzPSSession: true

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_SERVER }}
        username: ${{ secrets.ARM_CLIENT_ID }}
        password: ${{ secrets.ARM_CLIENT_SECRET }}

    - name: Build Docker image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        tags: ${{ secrets.ACR_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        load: true # Loads image onto runner for Trivy

    - name: Scan Docker image for vulnerabilities with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.ACR_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        format: 'table'
        exit-code: '1' # Fails the pipeline if vulnerabilities are found
        severity: 'CRITICAL,HIGH' # Only checks for Critical and High severity

    - name: Push Docker image to ACR
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.ACR_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.run_number }}
          ${{ secrets.ACR_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - 'prod' 

env:
  ACR_NAME: 'chronokeysacr'
  DOCKER_IMAGE_NAME: 'chronokeys-app'

jobs:
  build_and_push:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 


    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'
        enable-AzPSSession: true

    - name: Docker Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_SERVER }} 
        username: ${{ secrets.ARM_CLIENT_ID }} 
        password: ${{ secrets.ARM_CLIENT_SECRET }} 

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: . 
        file: ./Dockerfile 
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.DOCKER_IMAGE_NAME }}:${{ github.run_number }}
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.DOCKER_IMAGE_NAME }}:latest # Optionally push a 'latest' tag
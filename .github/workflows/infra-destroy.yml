name: Terraform Destroy Infrastructure

on:
  workflow_dispatch: # Manual trigger

permissions:
  id-token: write # OIDC token permission
  contents: read # Checkout repo permission

env:
  RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }} # Resource Group for TF state
  STORAGE_ACCOUNT_NAME: ${{ secrets.STORAGE_ACCOUNT_NAME }} # Storage Account for TF state
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }} # Container for TF state
  TFSTATE_KEY: ${{ secrets.TFSTATE_KEY }} # TF state file key

jobs:
  terraform_destroy: # Job: Terraform destroy
    runs-on: ubuntu-latest # Runner: Ubuntu

    steps:
    - name: Checkout repository code # Step: get code
      uses: actions/checkout@v4 # Action: checkout

    - name: Azure Login # Step: Azure auth
      uses: azure/login@v1 # Action: Azure login
      with:
        creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","tenantId":"${{ secrets.ARM_TENANT_ID }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}"}' # SPN creds
        auth-type: 'SERVICE_PRINCIPAL' # Auth type: Service Principal
        enable-AzPSSession: true # Enable AzPS

    - name: Setup Terraform # Step: Install Terraform
      uses: hashicorp/setup-terraform@v2 # Action: Setup Terraform
      with:
        terraform_version: 1.7.0 

    - name: Terraform Init # Step: Terraform Init
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ env.RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ env.STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=${{ env.CONTAINER_NAME }}" \
          -backend-config="key=${{ env.TFSTATE_KEY }}"

    - name: Terraform Destroy # Step: Terraform Destroy
      run: terraform destroy -auto-approve